<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Partajare Ecran</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px;
      background: #0f1115;
      color: #f3f4f6;
    }
    .card {
      background: #181b21;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    h2 { margin: 0 0 12px 0; font-size: 20px; }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      min-width: 200px;
      background: #0f1115;
      color: #fff;
      border: 1px solid #374151;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-green {
      background: #16a34a;
      color: #fff;
      width: 100%;
      padding: 15px;
      font-size: 16px;
    }
    .btn-gray { background: #374151; color: #fff; }
    #status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0f1115;
      border-left: 4px solid #2563eb;
      color: #d1d5db;
      font-size: 14px;
    }
    video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 14px;
      border: 1px solid #2a2f3a;
      display: block;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- VEDERE PENTRU CEL CARE CREEAZĂ LINKUL (MacBook / Vizitator) -->
  <div id="hostPanel" class="card">
    <h2>Vezi ecranul telefonului</h2>
    <div class="row">
      <button id="createLinkBtn" class="btn-blue" type="button">Generează link nou</button>
      <button id="copyBtn" class="btn-gray" type="button">Copiază link</button>
    </div>
    <div class="row">
      <input id="linkBox" type="text" readonly />
    </div>
    <div id="statusHost">Se conectează la server...</div>
  </div>

  <!-- VEDERE SIMPLĂ PENTRU CEL CU TELEFONUL (Android / iPhone) -->
  <div id="phonePanel" class="card hidden">
    <h2>Partajare ecran telefon</h2>
    <p style="color:#9ca3af; margin-top:0; font-size:14px;">
      Apasă butonul de mai jos și confirmă partajarea ecranului.
    </p>
    <button id="sharePhoneBtn" class="btn-green" type="button">Partajează ecranul</button>
    <div id="statusPhone" style="margin-top:12px; color:#9ca3af; font-size:14px;">Gata de pornire.</div>
  </div>

  <video id="remoteVideo" autoplay playsinline controls></video>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const SIGNALING_SERVER_URL = "https://filip-sait.onrender.com";
    const socket = io(SIGNALING_SERVER_URL, { transports: ["websocket", "polling"] });

    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get("room");
    const isPhoneInvite = Boolean(roomFromUrl);

    const hostPanel = document.getElementById("hostPanel");
    const phonePanel = document.getElementById("phonePanel");
    const createLinkBtn = document.getElementById("createLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const linkBox = document.getElementById("linkBox");
    const sharePhoneBtn = document.getElementById("sharePhoneBtn");
    const statusHost = document.getElementById("statusHost");
    const statusPhone = document.getElementById("statusPhone");
    const videoEl = document.getElementById("remoteVideo");

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    let currentRoom = roomFromUrl || ("s-" + Math.random().toString(36).substring(2, 8));
    let localStream = null;
    const peers = new Map();

    function setMsg(el, text) {
      el.textContent = text;
    }

    function buildInviteUrl(room) {
      return `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(room)}`;
    }

    if (isPhoneInvite) {
      // Când intri pe link-ul primit pe telefon, arată direct butonul mare de partajare
      hostPanel.classList.add("hidden");
      videoEl.classList.add("hidden");
      phonePanel.classList.remove("hidden");
    } else {
      // Când deschizi tu pagina principală, pregătești camera și intri ca viewer
      linkBox.value = buildInviteUrl(currentRoom);
      socket.on("connect", () => {
        socket.emit("join-room", { roomId: currentRoom, role: "viewer" });
        setMsg(statusHost, "Link pregătit. Trimite-l și așteaptă să apese «Partajează ecranul».");
      });
    }

    socket.on("connect_error", () => {
      setMsg(statusHost, "Eroare la conectarea cu serverul.");
      setMsg(statusPhone, "Eroare la conectarea cu serverul.");
    });

    createLinkBtn.addEventListener("click", () => {
      currentRoom = "s-" + Math.random().toString(36).substring(2, 8);
      linkBox.value = buildInviteUrl(currentRoom);
      videoEl.srcObject = null;
      socket.emit("join-room", { roomId: currentRoom, role: "viewer" });
      setMsg(statusHost, "Link nou creat. Copiază-l și trimite-l.");
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(linkBox.value);
        setMsg(statusHost, "Link copiat în clipboard.");
      } catch {
        linkBox.select();
        document.execCommand("copy");
        setMsg(statusHost, "Link selectat/copiat.");
      }
    });

    function createPeerConnection(remoteId) {
      const pc = new RTCPeerConnection(rtcConfig);
      peers.set(remoteId, pc);

      if (localStream) {
        localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        videoEl.srcObject = event.streams[0];
        setMsg(statusHost, "Vezi ecranul telefonului live.");
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("ice-candidate", { to: remoteId, candidate: event.candidate });
        }
      };

      return pc;
    }

    sharePhoneBtn.addEventListener("click", async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        setMsg(statusPhone, "Browserul nu suportă partajarea ecranului pe acest link/dispozitiv.");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 24, max: 30 } },
          audio: false
        });

        socket.emit("join-room", { roomId: currentRoom, role: "sharer" });
        setMsg(statusPhone, "Ecranul se partajează acum.");

        localStream.getVideoTracks()[0].addEventListener("ended", () => {
          setMsg(statusPhone, "Partajarea a fost oprită.");
          peers.forEach((pc) => pc.close());
          peers.clear();
        });
      } catch (err) {
        setMsg(statusPhone, "Nu s-a putut porni partajarea: " + err.message);
      }
    });

    socket.on("peer-joined", async ({ id }) => {
      if (localStream) {
        const pc = createPeerConnection(id);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("webrtc-offer", { to: id, offer });
      }
    });

    socket.on("webrtc-offer", async ({ from, offer }) => {
      const pc = createPeerConnection(from);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("webrtc-answer", { to: from, answer });
    });

    socket.on("webrtc-answer", async ({ from, answer }) => {
      const pc = peers.get(from);
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on("ice-candidate", async ({ from, candidate }) => {
      const pc = peers.get(from);
      if (pc && candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });
  </script>
</body>
</html>
