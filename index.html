<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partajare Ecran Live</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px;
      background: #0f1115;
      color: #f3f4f6;
    }
    h2 { margin-top: 0; font-size: 20px; }
    .card {
      background: #181b21;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input {
      background: #0f1115;
      color: #fff;
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      flex: 1;
      min-width: 150px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-secondary { background: #374151; color: #fff; }
    #status {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 12px;
      padding: 8px 12px;
      background: #0f1115;
      border-radius: 6px;
      border-left: 3px solid #2563eb;
    }
    video {
      width: 100%;
      max-height: 78vh;
      background: #000;
      border-radius: 12px;
      border: 1px solid #2a2f3a;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Partajare Ecran Live</h2>
    <div class="controls">
      <input id="roomInput" type="text" placeholder="Cod cameră" />
      <button id="copyLinkBtn" class="btn-secondary" type="button">Copiază link invitație</button>
      <button id="shareBtn" class="btn-success" type="button">Partajează ecranul (iPhone)</button>
      <button id="viewBtn" class="btn-primary" type="button">Vizionează (MacBook)</button>
    </div>
    <div id="status">Se inițializează conexiunea cu serverul...</div>
  </div>

  <video id="remoteVideo" autoplay playsinline controls></video>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    // PUNE AICI URL-UL SERVERULUI NODE.JS (ex: https://server-semnalizare.onrender.com)
    // NU pune https://filip-bank.netlify.app/
    const SIGNALING_SERVER_URL = "https://PUNE-AICI-URL-UL-SERVERULUI-NODE.onrender.com";

    const socket = io(SIGNALING_SERVER_URL, {
      transports: ["websocket", "polling"]
    });

    const roomInput = document.getElementById("roomInput");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const shareBtn = document.getElementById("shareBtn");
    const viewBtn = document.getElementById("viewBtn");
    const statusEl = document.getElementById("status");
    const videoEl = document.getElementById("remoteVideo");

    const urlParams = new URLSearchParams(window.location.search);
    const initialRoom = urlParams.get("room") || "cam-" + Math.random().toString(36).substring(2, 7);
    roomInput.value = initialRoom;

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    let localStream = null;
    const peers = new Map();
    let currentRole = null;

    function setStatus(msg, color = "#2563eb") {
      statusEl.textContent = msg;
      statusEl.style.borderLeftColor = color;
    }

    socket.on("connect", () => {
      setStatus("Conectat la server. Alege rolul sau trimite linkul.", "#16a34a");
    });

    socket.on("connect_error", () => {
      setStatus("Eroare la conectarea cu serverul de semnalizare. Verifică URL-ul serverului.", "#dc2626");
    });

    copyLinkBtn.addEventListener("click", async () => {
      const room = roomInput.value.trim();
      if (!room) return;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(room)}`;
      try {
        await navigator.clipboard.writeText(inviteUrl);
        setStatus("Link copiat! Trimite-l prietenului: " + inviteUrl, "#16a34a");
      } catch {
        prompt("Copiază acest link:", inviteUrl);
      }
    });

    function createPeerConnection(remoteId) {
      const pc = new RTCPeerConnection(rtcConfig);
      peers.set(remoteId, pc);

      if (localStream) {
        localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        videoEl.srcObject = event.streams[0];
        setStatus("Primești imaginea live!", "#16a34a");
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("ice-candidate", { to: remoteId, candidate: event.candidate });
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
          setStatus("Conexiunea video s-a întrerupt.", "#dc2626");
        }
      };

      return pc;
    }

    shareBtn.addEventListener("click", async () => {
      const roomId = roomInput.value.trim();
      if (!roomId) return alert("Introdu un cod de cameră.");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        setStatus("Browserul nu suportă partajarea ecranului (necesită Safari iOS 15+ pe HTTPS).", "#dc2626");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 60 } },
          audio: false
        });

        currentRole = "sharer";
        socket.emit("join-room", { roomId, role: "sharer" });
        setStatus("Partajezi ecranul în camera: " + roomId, "#16a34a");

        localStream.getVideoTracks()[0].addEventListener("ended", () => {
          setStatus("Ai oprit partajarea ecranului.", "#eab308");
          peers.forEach((pc) => pc.close());
          peers.clear();
        });
      } catch (err) {
        setStatus("Partajare anulată sau blocată: " + err.message, "#dc2626");
      }
    });

    viewBtn.addEventListener("click", () => {
      const roomId = roomInput.value.trim();
      if (!roomId) return alert("Introdu un cod de cameră.");

      currentRole = "viewer";
      socket.emit("join-room", { roomId, role: "viewer" });
      setStatus("Aștepți ca prietenul să pornească partajarea în camera: " + roomId, "#2563eb");
    });

    socket.on("peer-joined", async ({ id }) => {
      if (currentRole === "sharer" && localStream) {
        const pc = createPeerConnection(id);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("webrtc-offer", { to: id, offer });
      }
    });

    socket.on("webrtc-offer", async ({ from, offer }) => {
      const pc = createPeerConnection(from);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("webrtc-answer", { to: from, answer });
    });

    socket.on("webrtc-answer", async ({ from, answer }) => {
      const pc = peers.get(from);
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on("ice-candidate", async ({ from, candidate }) => {
      const pc = peers.get(from);
      if (pc && candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on("peer-left", ({ id }) => {
      const pc = peers.get(id);
      if (pc) {
        pc.close();
        peers.delete(id);
      }
      setStatus("Cealaltă persoană a părăsit camera.", "#eab308");
    });
  </script>
</body>
</html>
